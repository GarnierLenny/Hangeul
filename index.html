<style>
  :root{
    --paper:#f5f4f1; --ink:#16161a; --muted:#8a8a94; --line:#e6e4de;
    --accent:#3d5afe; --accent-soft:rgba(61,90,254,.12);
    --gold:#ffb703; --good:#12b886; --coral:#ff5a5f;
    --tile:#ffffff; --shadow:0 8px 24px rgba(20,20,30,.10);
    --han:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(120% 90% at 50% -10%, #ffffff 0%, var(--paper) 55%);
    color:var(--ink); font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    min-height:100dvh; overflow:hidden; touch-action:manipulation;
  }
  header{width:100%;max-width:520px;padding:18px 22px 6px;display:flex;align-items:center;justify-content:space-between}
  .brand{font-weight:700;letter-spacing:.02em;font-size:15px}
  .brand b{font-family:var(--han);color:var(--accent)}
  .back{border:0;background:var(--accent-soft);color:var(--accent);font:inherit;font-size:13px;font-weight:700;
    padding:7px 12px;border-radius:10px;cursor:pointer;transition:transform .12s}
  .back:active{transform:scale(.95)}
  .acct{border:0;background:var(--accent-soft);color:var(--accent);font:inherit;font-size:13px;font-weight:700;
    padding:7px 12px;border-radius:10px;cursor:pointer;transition:transform .12s;max-width:120px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .acct:active{transform:scale(.95)}
  .acct.in{background:var(--good);background:rgba(18,182,134,.14);color:var(--good)}

  /* auth modal */
  .auth-veil{align-items:center;z-index:80}
  .auth-card{position:relative;background:#fff;border-radius:24px;width:100%;max-width:360px;
    padding:30px 26px calc(24px + env(safe-area-inset-bottom));box-shadow:0 18px 50px rgba(0,0,0,.28);text-align:center}
  .auth-close{position:absolute;top:14px;right:16px;border:0;background:transparent;color:var(--muted);
    font-size:24px;line-height:1;cursor:pointer;padding:2px 6px}
  .auth-title{font-family:var(--han),inherit;font-weight:800;font-size:22px;letter-spacing:-.01em}
  .auth-sub{color:var(--muted);font-size:13.5px;margin-top:6px}
  .auth-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;
    border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:600;font-size:15px;
    padding:13px 16px;border-radius:12px;cursor:pointer;transition:transform .12s,background .2s}
  .auth-google:hover{background:var(--paper)}
  .auth-google:active{transform:scale(.97)}
  .auth-or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:16px 0 0}
  .auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}
  .auth-input{width:100%;margin-top:14px;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;
    font:inherit;font-size:15px;background:var(--paper);color:var(--ink);outline:none;transition:border-color .2s}
  .auth-input:focus{border-color:var(--accent)}
  .auth-err{min-height:18px;margin-top:10px;font-size:13px;font-weight:600;color:var(--coral)}
  .auth-card .cta{width:100%;margin-top:6px}
  .auth-toggle{margin-top:14px;border:0;background:transparent;color:var(--accent);font:inherit;font-size:13.5px;
    font-weight:600;cursor:pointer}

  .stage{flex:1;width:100%;max-width:520px;padding:0 22px 20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;touch-action:none}
  .stage.map-mode{justify-content:flex-start;overflow-y:auto;touch-action:auto;padding-top:10px}

  /* level select: a grid of nodes you cannot skip */
  .map{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 12px;justify-items:center;
    width:100%;max-width:330px;margin:0 auto;padding:6px 0 40px}
  @media (max-width:360px){ .map{grid-template-columns:repeat(3,1fr)} }
  /* desktop: widen the board so it reads as an intentional layout, not a phone strip.
     the play screen stays comfortably centred — wide drag targets hurt, not help. */
  @media (min-width:760px){
    header,.stage{max-width:680px}
    .stage.map-mode{max-width:none;padding-left:0;padding-right:0}
    .map-mode > .review-card,.map-mode > .journal-card,.map-mode > .dev{max-width:560px}
    .map{max-width:560px;grid-template-columns:repeat(5,1fr);gap:28px 18px}
    .node-em{font-size:38px}
  }
  .node{display:flex;flex-direction:column;align-items:center}
  .node-btn{position:relative;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;
    font-size:31px;line-height:1;background:#fff;box-shadow:var(--shadow);border:0;cursor:pointer;transition:transform .15s}
  .node-btn:active{transform:scale(.93)}
  .node.done .node-btn{background:rgba(18,182,134,.10);box-shadow:inset 0 0 0 2px var(--good),0 6px 16px rgba(18,182,134,.16)}
  .node.current .node-btn{box-shadow:0 0 0 5px var(--accent-soft),0 12px 26px rgba(61,90,254,.30);animation:bob 1.7s ease-in-out infinite}
  .node.locked .node-btn{background:#eceae5;box-shadow:none;cursor:default}
  .node.locked .node-em{filter:grayscale(1);opacity:.4}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .node-num{margin-top:8px;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--muted)}
  .node.current .node-num{color:var(--accent)}
  .node.done .node-num{color:var(--good)}
  .badge{position:absolute;top:-6px;right:-6px;width:23px;height:23px;border-radius:50%;
    display:grid;place-items:center;color:#fff;background:var(--good);box-shadow:0 2px 6px rgba(0,0,0,.18)}
  .badge.lock{background:#c7c6c0}
  .node-stars{display:flex;gap:2px;margin-top:4px;height:12px}
  .node-stars span{width:11px;height:11px;display:block}
  .node-stars span.on{color:var(--gold)}
  .node-stars span.off{color:#d4d2ca}

  /* daily review card + streak */
  .review-card{display:flex;align-items:center;gap:13px;width:100%;max-width:330px;margin:0 auto 6px;
    background:var(--tile);border-radius:16px;box-shadow:var(--shadow);padding:12px 15px}
  .review-card .streak{display:flex;align-items:center;gap:4px;font-weight:800;font-size:17px;color:var(--gold);flex:none}
  .review-card .streak svg{width:18px;height:18px}
  .rc-main{flex:1;min-width:0}
  .rc-title{font-weight:700;font-size:14px}
  .rc-sub{font-size:12px;color:var(--muted);margin-top:1px}
  .rc-go{flex:none;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:13px;
    padding:10px 18px;border-radius:11px;cursor:pointer;transition:transform .12s}
  .rc-go:active{transform:scale(.94)}
  /* discovery journal: the dictionary the learner writes themselves */
  .journal-card{display:flex;align-items:center;gap:11px;width:100%;max-width:330px;margin:0 auto 6px;
    background:var(--tile);border:0;border-radius:16px;box-shadow:var(--shadow);padding:12px 15px;
    font:inherit;text-align:left;cursor:pointer;transition:transform .12s}
  .journal-card:active{transform:scale(.97)}
  .jc-book{font-size:21px;flex:none}
  .jc-title{font-weight:700;font-size:14px}
  .jc-sub{font-size:12px;color:var(--muted);margin-top:1px}
  .journal{width:100%;max-width:330px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-bottom:30px}
  .journal h2{font-size:17px;margin:6px 0 0;text-align:center}
  .journal .j-sub{font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 8px}
  .jrow{display:flex;align-items:center;gap:12px;background:var(--tile);border-radius:14px;
    box-shadow:var(--shadow);padding:10px 14px;cursor:pointer}
  .jrow .jh{font-size:22px;font-weight:700}
  .jrow .je{font-size:19px}
  .jrow .jm{margin-left:auto;font-size:14px;color:var(--muted);font-weight:600}
  .j-locked{text-align:center;font-size:12.5px;color:var(--muted);margin-top:10px}
  .undisc{color:#c9c7bf}
  /* lesson runner: burst progress + end-of-lesson recap */
  .lesson-bar{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}
  .lesson-bar .lb{width:26px;height:5px;border-radius:3px;background:var(--line);transition:background .2s}
  .lesson-bar .lb.done{background:var(--good)}
  .lesson-bar .lb.now{background:var(--accent)}
  .recap-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:12px 0 4px}
  .recap{background:var(--accent-soft);color:var(--accent);border-radius:11px;padding:6px 11px;font-weight:700;font-size:15px}
  /* the guess moment */
  .guess-q{font-size:15px;color:var(--muted);text-align:center;margin:2px 0 0}
  .guess-emoji{font-size:44px;text-align:center;margin:2px 0 -2px}
  .guess-han{font-size:52px;font-weight:800;text-align:center;cursor:pointer;line-height:1.15}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
  .choices.col{grid-template-columns:1fr}          /* grammar functions are phrases, stack them */
  .choices.col .choice{font-weight:600;font-size:14px}
  .choice{border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:13px 8px;

  .choice:active{transform:scale(.95)}
  .dev{width:100%;max-width:330px;margin:0 auto 14px;text-align:right}

  /* target: the emoji you recognize + the word you build, shown from the start */
  .goal{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  .goal-emoji{font-size:clamp(58px,19vw,92px);line-height:1;margin-bottom:18px;cursor:pointer;

  .say-btn:hover{background:rgba(61,90,254,.2)}
  .say-btn:active{transform:scale(.9)}
  .instr{margin:2px 0 0;color:var(--muted);font-size:14px}
  ::selection{background:var(--accent-soft)}

  .blocks{display:flex;gap:16px;justify-content:center;--bsz:clamp(120px,58vw,210px)}
  .block{position:relative;width:var(--bsz);height:var(--bsz);
    border-radius:20px;background:rgba(255,255,255,.5);
    box-shadow:inset 0 0 0 2px var(--line); transition:box-shadow .3s}
  .block.solved{box-shadow:inset 0 0 0 2px var(--good), 0 12px 30px rgba(18,182,134,.22)}
  .block.given{display:grid;place-items:center;font-family:var(--han);font-weight:800;color:var(--muted);
    background:rgba(20,20,30,.02);box-shadow:inset 0 0 0 2px var(--line)}
  .slot{position:absolute;display:flex;align-items:center;justify-content:center;

  @keyframes pulse{50%{background:rgba(61,90,254,.22)}}
  .slot.filled{background:transparent;box-shadow:none}

  .tray{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:360px}
  .tile{width:var(--tsz);height:var(--tsz);--tsz:clamp(60px,17vw,78px);
    background:var(--tile);border-radius:16px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;

  .tile .j{font-family:var(--han);font-weight:700;font-size:calc(var(--tsz)*.46);line-height:1}
  .tile .r{font-size:12px;color:var(--muted);font-weight:600}
  .tile.used{opacity:.22;pointer-events:none}
  .tile.ghost{position:fixed;z-index:50;pointer-events:none;box-shadow:0 16px 36px rgba(20,20,30,.28);cursor:grabbing;margin:0}

  /* M2: whole-word tiles → build a sentence in order */
  .seq{display:flex;gap:12px;justify-content:center;font-size:clamp(38px,11vw,58px);line-height:1;
    filter:drop-shadow(0 12px 20px rgba(20,20,30,.14))}
  .m2-gloss{margin-top:12px;color:var(--muted);font-size:15px;font-weight:500}
  .sentence{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:440px;min-height:56px}

    font-family:var(--han);font-weight:700;font-size:20px;color:var(--ink)}
  .slot.word:not(.filled){box-shadow:inset 0 0 0 2px var(--accent-soft);
    background:repeating-linear-gradient(45deg,rgba(61,90,254,.04) 0 8px,transparent 8px 16px)}

  .tile.word{width:auto;height:auto;flex-direction:row;gap:8px;padding:12px 16px}
  .tile.word .wj{font-family:var(--han);font-weight:700;font-size:20px}
  .tile.word .we{font-size:17px}

  /* celebration panel */

  .panel{width:100%;max-width:520px;background:#fff;border-radius:26px 26px 0 0;
    padding:34px 28px calc(30px + env(safe-area-inset-bottom));text-align:center;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
  .panel .p-emoji{font-size:clamp(72px,24vw,110px);line-height:1;
    filter:drop-shadow(0 16px 26px rgba(20,20,30,.16))}
  .panel .word{margin-top:8px;font-family:var(--han);font-weight:800;font-size:clamp(52px,18vw,92px);line-height:1;letter-spacing:-.02em}
  .panel .roma{margin-top:8px;font-size:19px;color:var(--muted);font-weight:600;letter-spacing:.04em}
  .panel .roma b{color:var(--good)}
  .panel .tag{margin-top:6px;font-size:14px;color:var(--muted)}
  .say-row{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:22px}
  .mic{display:inline-flex;align-items:center;gap:9px;border:1.5px solid var(--line);background:var(--paper);
    color:var(--ink);font:inherit;font-weight:700;font-size:15px;padding:12px 22px;border-radius:13px;cursor:pointer;
    transition:transform .12s,background .2s,border-color .2s}
  .mic:hover{border-color:var(--accent);background:var(--accent-soft)}
  .mic:active{transform:scale(.96)}
  .mic .mic-ic{width:19px;height:19px;color:var(--accent);flex:none}
  .mic.listening{background:var(--accent);border-color:var(--accent);color:#fff;animation:micpulse 1.1s ease-in-out infinite}
  .mic.listening .mic-ic{color:#fff}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 10px var(--accent-soft)}}
  .say-feedback{font-size:13.5px;font-weight:650;min-height:18px;letter-spacing:.01em}
  .say-feedback.ok{color:var(--good)}
  .say-feedback.warn{color:var(--coral)}
  .cta{margin-top:22px;border:0;background:var(--ink);color:#fff;font-size:16px;font-weight:700;
    padding:15px 30px;border-radius:14px;cursor:pointer;font-family:inherit}
  .cta.share{background:var(--accent)}
  .confetti{position:fixed;top:0;left:0;width:8px;height:14px;border-radius:2px;z-index:61;pointer-events:none}

  /* guided-trace overlay */
  .trace-veil{align-items:center;z-index:70}
  .trace-card{background:#fff;border-radius:24px;width:100%;max-width:360px;text-align:center;
    padding:24px 22px calc(22px + env(safe-area-inset-bottom));box-shadow:0 18px 50px rgba(0,0,0,.28)}
  .trace-head{font-weight:700;font-size:16px;margin-bottom:16px;color:var(--ink)}
  .trace-head b{font-family:var(--han);color:var(--accent)}
  .trace-stage{position:relative;width:100%;max-width:280px;aspect-ratio:1;margin:0 auto;border-radius:16px;
    background:var(--paper);box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
  .trace-guide{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--han);font-weight:800;
    color:rgba(20,20,30,.12);line-height:1;pointer-events:none;user-select:none}
  #traceCanvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}
  .trace-hint{margin-top:14px;color:var(--muted);font-size:12px}
  .trace-actions{display:flex;gap:12px;justify-content:center;margin-top:20px}
  .trace-actions .cta{margin-top:0}
  .trace-clear{border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:700;
    font-size:15px;padding:15px 24px;border-radius:14px;cursor:pointer;transition:transform .12s}
  .trace-clear:active{transform:scale(.96)}
  /* the optional "trace it" button on the reveal */
  .trace-row{display:flex;justify-content:center;margin-top:16px}
  .trace-btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--paper);
    color:var(--ink);font:inherit;font-weight:700;font-size:15px;padding:11px 20px;border-radius:12px;cursor:pointer;
    transition:transform .12s,border-color .2s,background .2s}

  .trace-btn:active{transform:scale(.96)}
  .trace-btn svg{width:18px;height:18px;color:var(--accent);flex:none}

<body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";

/* ================= Hangul engine: any word -> blocks + tiles ================= */
// Unicode syllable = lead(19) x vowel(21) x tail(28), base 가 = 0xAC00.
const CHO=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const JUNG=["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅗ","ㅘ","ㅙ","ㅚ","ㅛ","ㅜ","ㅝ","ㅞ","ㅟ","ㅠ","ㅡ","ㅢ","ㅣ"];
const JONG=["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const S_CHO={ㄱ:"g",ㄲ:"kk",ㄴ:"n",ㄷ:"d",ㄸ:"tt",ㄹ:"r",ㅁ:"m",ㅂ:"b",ㅃ:"pp",ㅅ:"s",ㅆ:"ss",ㅇ:"",ㅈ:"j",ㅉ:"jj",ㅊ:"ch",ㅋ:"k",ㅌ:"t",ㅍ:"p",ㅎ:"h"};
const S_JUNG={ㅏ:"a",ㅐ:"ae",ㅑ:"ya",ㅒ:"yae",ㅓ:"eo",ㅔ:"e",ㅕ:"yeo",ㅖ:"ye",ㅗ:"o",ㅘ:"wa",ㅙ:"wae",ㅚ:"oe",ㅛ:"yo",ㅜ:"u",ㅝ:"wo",ㅞ:"we",ㅟ:"wi",ㅠ:"yu",ㅡ:"eu",ㅢ:"ui",ㅣ:"i"};
const S_JONG={ㄱ:"k",ㄴ:"n",ㄷ:"t",ㄹ:"l",ㅁ:"m",ㅂ:"p",ㅅ:"t",ㅇ:"ng",ㅈ:"t",ㅊ:"t",ㅋ:"k",ㅌ:"t",ㅍ:"p",ㅎ:"t",ㄲ:"k",ㅆ:"t"};
const VERTICAL=new Set(["ㅏ","ㅐ","ㅑ","ㅒ","ㅓ","ㅔ","ㅕ","ㅖ","ㅣ"]);   // vowel goes RIGHT
const HORIZONTAL=new Set(["ㅗ","ㅛ","ㅜ","ㅠ","ㅡ"]);                  // vowel goes BELOW
// a wrapping vowel IS two basic vowels: a horizontal one (sits bottom) + a vertical one (sits right).
// so we build it from its parts in their real L-positions — truer to write, truer to read.
const VOWEL_PARTS={ "ㅘ":["ㅗ","ㅏ"], "ㅙ":["ㅗ","ㅐ"], "ㅚ":["ㅗ","ㅣ"],
                    "ㅝ":["ㅜ","ㅓ"], "ㅞ":["ㅜ","ㅔ"], "ㅟ":["ㅜ","ㅣ"], "ㅢ":["ㅡ","ㅣ"] };

function syllable(ch){
  const c=ch.charCodeAt(0)-0xAC00;
  if(c<0||c>11171) return null;
  return {cho:CHO[Math.floor(c/588)], jung:JUNG[Math.floor((c%588)/28)], jong:JONG[c%28]};
}
function syllableParts(ch){        // letters in build order, each with its role-sound
  const s=syllable(ch); if(!s) return [];
  const p=[{j:s.cho,sound:S_CHO[s.cho]}];
  const vp=VOWEL_PARTS[s.jung];
  if(vp) vp.forEach(v=>p.push({j:v,sound:S_JUNG[v]}));   // split a wrapping vowel into its two letters
  else p.push({j:s.jung,sound:S_JUNG[s.jung]});
  if(s.jong) p.push({j:s.jong,sound:S_JONG[s.jong]});
  return p;
}
function syllableSlots(ch){        // [jamo,x,y,w,h] rects chosen from the shape
  const s=syllable(ch); if(!s) return [];
  const vp=VOWEL_PARTS[s.jung];
  if(vp){                          // wrapping vowel: consonant top-left, horizontal part bottom, vertical part right
    const [hp,vt]=vp;
    if(!s.jong) return [[s.cho,0,0,58,58],[hp,0,58,58,42],[vt,58,0,42,100]];
    return [[s.cho,0,0,58,40],[vt,58,0,42,62],[hp,0,40,58,22],[s.jong,0,62,100,38]];
  }
  const horiz=HORIZONTAL.has(s.jung);
  if(!s.jong) return horiz ? [[s.cho,0,0,100,50],[s.jung,0,50,100,50]]
                           : [[s.cho,0,0,50,100],[s.jung,50,0,50,100]];
  return horiz ? [[s.cho,0,0,100,34],[s.jung,0,34,100,33],[s.jong,0,67,100,33]]
               : [[s.cho,0,0,55,55],[s.jung,55,0,45,55],[s.jong,0,55,100,45]];
}
const DECOY_POOL=["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅈ","ㅎ","ㅏ","ㅓ","ㅗ","ㅜ","ㅡ","ㅣ","ㅐ"];
const dsound = j => S_CHO[j] ?? S_JUNG[j] ?? "";
function partsOf(han){ const o=[]; for(const ch of han) o.push(...syllableParts(ch)); return o; }
function needSetOf(han){ return new Set(partsOf(han).map(p=>p.j)); }
function blocksOf(han){ return [...han].map(syllableSlots); }
function romaOf(han){   // whole syllables (so ㅘ keeps its real sound "wa"), WITH liaison: a final
                        // consonant before a silent-onset syllable slides over and takes its onset
                        // sound — 먹어요 = "meogeoyo", 얼음 = "eoreum". ㅇ(ng) never links.
                        // ponytail: silent-ㅎ liaison (좋아=joa) isn't handled — no such word in the bank.
  const syl=[...han].map(syllable);
  let o="", carry=null;
  for(let i=0;i<syl.length;i++){
    const s=syl[i]; if(!s){ carry=null; continue; }
    const onset = carry!=null ? carry : S_CHO[s.cho];
    const next=syl[i+1];
    let coda="";
    if(s.jong && s.jong!=="ㅇ" && next && next.cho==="ㅇ") carry=S_CHO[s.jong];  // links forward
    else { coda = s.jong ? S_JONG[s.jong] : ""; carry=null; }
    o += onset + S_JUNG[s.jung] + coda;
  }
  return o;
}
function trayFor(han){              // one tile per slot (handles repeats) + 1-2 decoys
  const parts=partsOf(han), needSet=new Set(parts.map(p=>p.j));
  const tray=parts.map(p=>`${p.j}|${p.sound}`);
  const decoys=DECOY_POOL.filter(j=>!needSet.has(j));
  for(let i=0,nd=parts.length<=2?1:2;i<nd && decoys.length;i++){
    const k=Math.floor(Math.random()*decoys.length), dj=decoys[k];
    tray.push(`${dj}|${dsound(dj)}`); decoys.splice(k,1);
  }
  return tray;
}

/* ================= the banks: content is now just data ================= */
// A word is {han, emoji, mean}. That's it — blocks, tiles, romaja are derived.
// Ordered so each word adds ~1-2 new letters. Covers all 14 consonants, all 5
// double consonants, and every vowel except ㅒ and ㅞ (both near-extinct in real words).
const WORD_BANK=[
  // basic consonants + basic vowels, one syllable
  {han:"나",emoji:"🙋",mean:"me"},      {han:"소",emoji:"🐮",mean:"cow"},
  {han:"개",emoji:"🐶",mean:"dog"},      {han:"코",emoji:"👃",mean:"nose"},
  {han:"비",emoji:"🌧️",mean:"rain"},     {han:"거미",emoji:"🕷️",mean:"spider"},   // ㅓ ㅁ
  {han:"다리",emoji:"🦵",mean:"leg"},     {han:"해",emoji:"☀️",mean:"sun"},        // ㄷㄹ · ㅎ

function makeWord(w, seen){

           blocks:blocksOf(w.han), tray:trayFor(w.han), hard:[...need].every(j=>seen.has(j)) };
}
function makeSentence(s, seen){   // PARKED: the fill-in-the-blank builder (given phrase + build one word). Not called yet.
  const nw=WORD_BANK.find(w=>w.han===s.noun);
  const need=needSetOf(s.noun);
  return { word:s.noun+" "+s.pat.suffix, roma:romaOf(s.noun)+" "+s.pat.roma, emoji:nw.emoji,
           mean:s.pat.gloss+" "+nw.mean, tag:"same shape, new word — spot the pattern",
           // build only the noun; the pattern phrase is shown, already written
           blocks:blocksOf(s.noun).concat([...s.pat.suffix]),
           tray:trayFor(s.noun), hard:[...need].every(j=>seen.has(j)) };

function makeM2(m){
  const words=m.seq.map(s=>s[0]);
  return { m2:true, id:"s:"+words.join("_"), word:words.join(" "), roma:words.map(romaOf).join(" "),
           mean:m.mean, emoji:m.emoji, seq:m.seq, tray:[...words, m.decoy], hard:false };
}
function buildCurriculum(){
  const seen=new Set(), out=[];
  // a sentence appears right after the last word it needs — words get used, fast
  const wordIdx=Object.fromEntries(WORD_BANK.map((w,i)=>[w.han,i]));
  const slotOf=m=>Math.max(...m.seq.map(s=>wordIdx[s[0]]).filter(v=>v!=null));
  WORD_BANK.forEach((w,i)=>{
    out.push(makeWord(w,seen)); needSetOf(w.han).forEach(j=>seen.add(j));
    M2.filter(m=>slotOf(m)===i).forEach(m=>out.push(makeM2(m)));
  });
  return out;
}

  beep(freq,dur=.12,type="triangle",gain=.18){
    if(!AC) return;

    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(AC.destination);

function listenOnce(){
  return new Promise(res=>{
    if(!SpeechRec){ res({error:"unsupported"}); return; }
    try{ speechSynthesis.cancel(); }catch(e){}     // free the audio pipe before listening
    let done=false, tries=0, rec, lastErr=null;
    const finish=v=>{ if(done) return; done=true; try{ rec&&rec.stop(); }catch(e){} res(v); };
    const start=()=>{
      tries++;
      rec=new SpeechRec(); rec.lang="ko-KR"; rec.continuous=false; rec.interimResults=false; rec.maxAlternatives=4;
      const t0=performance.now();
      // ended before the user could realistically speak -> a dud, retry once
      const premature=()=>{ if(done) return; if(performance.now()-t0<1500 && tries<2) setTimeout(start,300); else finish({error:lastErr||"nospeech"}); };
      rec.onresult=e=>finish({alts:[...e.results[0]].map(a=>a.transcript)});
      rec.onerror=e=>{ const err=e.error||"error"; lastErr=err;
        // permission and backend errors won't fix on retry — surface them straight away
        if(err==="not-allowed"||err==="service-not-allowed"||err==="network"){ finish({error:err}); return; }
        premature(); };
      rec.onend=premature;
      try{ rec.start(); }catch(e){ if(tries<2) setTimeout(start,300); else finish({error:"start"}); }
    };
    start();
    setTimeout(()=>finish({error:"nospeech"}), 10000);       // hard stop
  });
}
const norm = s => (s||"").replace(/[\s.,!?~·]/g,"");
function sim(a,b){                     // 0..1 similarity (Levenshtein ratio)
  if(a===b) return 1; if(!a||!b) return 0;
  const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return 1-d[m][n]/Math.max(m,n);
}
function heardMatch(alts, target){     // forgiving on purpose: beginners + phone mics
  const t=norm(target);
  return (alts||[]).some(a=>{ const n=norm(a); return n===t||n.includes(t)||t.includes(n)||sim(n,t)>=0.6; });
}

function bumpJournal(lv){                      // one exposure per word in the level just solved
  const ws = lv.m2 ? lv.seq.map(s=>s[0]) : [lv.word];
  ws.forEach(h=>{ if(!WORD_BANK.some(b=>b.han===h)) return;
    const j=journal[h]||(journal[h]={seen:0,got:null});
    j.seen=(j.seen||0)+1; });
  saveJournal();
}
const isRipe = h => { const j=journal[h];
  return j && !j.got && (j.seen||0)>=RIPE_AT && (j.cool||0)<=(j.seen||0); };
function nextRipe(preferHan){                  // the word whose meaning is ready to be guessed
  if(preferHan && isRipe(preferHan)) return preferHan;
  return Object.keys(journal).find(isRipe) || null;
}
// up to n words ready to guess, this lesson's own words first
function ripeBatch(le, n){
  const mine = le.items.filter(it=>!it.m2).map(it=>it.word).filter(isRipe);
  const rest = Object.keys(journal).filter(h=>isRipe(h) && !mine.includes(h));
  return [...new Set([...mine, ...rest])].slice(0, n);
}
function chainGuesses(list, done){
  if(!list.length){ done(); return; }
  showGuess(list[0], ()=> chainGuesses(list.slice(1), done));
}

/* ---- grammar by inference: the same discovery loop, but for function words & structure.
   A concept (a particle, a word-order rule…) is never explained. After it has shown up in
   enough sentences, the app asks what job it does — the learner reasons it out from having
   watched it behave. Extends to 을/를, 이/가, verb-final order by adding to CONCEPTS. ---- */
const GKEY="hangeul.grammar.v1";
let grammar=readJSON(GKEY,{});
const saveGrammar=()=>{ writeJSON(GKEY,grammar); cloudSaveDebounced(); };
const CONCEPTS=[
  { id:"topic-neun", marker:"는", trigger:3,
    q:"는 latches onto the one doing the action, every time. what do you think it marks?",
    right:"who or what the sentence is about",
    wrong:["the word “and”", "where it is happening"] },
];
const conceptByMarker={}; CONCEPTS.forEach(c=>conceptByMarker[c.marker]=c);
function bumpConcepts(lv){                      // a completed sentence is one sighting of its markers
  if(!lv.m2) return;
  const words=lv.seq.map(s=>s[0]); let changed=false;
  CONCEPTS.forEach(c=>{ if(words.includes(c.marker)){
    const g=grammar[c.id]||(grammar[c.id]={seen:0,got:false}); g.seen=(g.seen||0)+1; changed=true; } });
  if(changed) saveGrammar();
}
const conceptRipe = c => { const g=grammar[c.id];
  return g && !g.got && (g.seen||0)>=c.trigger && (g.cool||0)<=(g.seen||0); };
const conceptBatch = n => CONCEPTS.filter(conceptRipe).slice(0, n);
function showConceptGuess(c, cont){
  const opts=shuffle([c.right, ...c.wrong]);
  panel.innerHTML=`
    <div class="guess-q">you've seen <b>${c.marker}</b> a few times now…</div>
    <div class="guess-han" id="cMark">${c.marker}</div>
    <div class="guess-q"><b>${c.q}</b></div>
    <div class="choices col">${opts.map(o=>`<button class="choice" data-r="${o===c.right?1:0}">${o}</button>`).join("")}</div>`;
  document.getElementById("cMark").onclick=()=>speak(c.marker);
  panel.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    const g=grammar[c.id];
    if(b.dataset.r==="1"){
      g.got=c.right; g.day=today(); saveGrammar(); audio.win(); burst();
      panel.innerHTML=`
        <div class="p-emoji">🧩</div>
        <div class="word">${c.marker}</div>
        <div class="tag">you cracked it — ${c.marker} marks <b>${c.right}</b></div>
        <button class="cta">continue →</button>`;
    } else {
      g.cool=(g.seen||0)+1; g.missed=true; saveGrammar(); try{ audio.err(); }catch(e){}
      panel.innerHTML=`
        <div class="p-emoji">🤔</div>
        <div class="word">not quite</div>
        <div class="tag">keep an eye on where ${c.marker} sits — it'll come back</div>
        <button class="cta">continue →</button>`;
    }
    panel.querySelector(".cta").onclick=cont;
  });
}
function chainConcepts(list, done){
  if(!list.length){ done(); return; }
  showConceptGuess(list[0], ()=> chainConcepts(list.slice(1), done));
}
function distractorsFor(mean){
  return shuffle(WORD_BANK.map(w=>w.mean).filter(m=>m!==mean)).slice(0,3);
}
function showGuess(han, cont){                 // asked inside the celebrate veil; no reveal on miss
  const w=WORD_BANK.find(b=>b.han===han); if(!w){ cont(); return; }
  const opts=shuffle([w.mean, ...distractorsFor(w.mean)]);
  const hint = journal[han] && journal[han].missed;   // a prior miss earns the emoji as a nudge
  panel.innerHTML=`
    <div class="guess-q">${hint?"here it is again…":"you've read this a couple of times…"}</div>
    ${hint?`<div class="guess-emoji">${w.emoji}</div>`:``}
    <div class="guess-han" id="guessHan">${han}</div>
    <div class="guess-q"><b>what do you think it means?</b></div>
    <div class="choices">${opts.map(o=>`<button class="choice" data-m="${o}">${o}</button>`).join("")}</div>`;
  document.getElementById("guessHan").onclick=()=>speak(han);
  speak(han);
  panel.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
    const j=journal[han];
    if(b.dataset.m===w.mean){
      j.got=w.mean; j.day=today(); saveJournal();
      audio.win(); burst();
      panel.innerHTML=`
        <div class="p-emoji">📖</div>
        <div class="word">${han} = ${w.mean}</div>
        <div class="tag">you figured it out yourself — added to your journal</div>
        <button class="cta">continue →</button>`;
    } else {
      j.cool=(j.seen||0)+1; j.missed=true; saveJournal();   // no reveal; comes back next sighting, with the emoji
      try{ audio.err(); }catch(e){}
      panel.innerHTML=`
        <div class="p-emoji">🤫</div>
        <div class="word">not yet</div>
        <div class="tag">keep reading — it'll come back with a hint</div>
        <button class="cta">continue →</button>`;
    }
    panel.querySelector(".cta").onclick=cont;
  });
}
let mistakes=0, reviewMode=false, reviewQueue=[], reviewPos=0;
let lessonMode=false, lessonIdx=-1, lesson=[], lessonPos=0;   // lesson = L-indices of its items
const dueNow=()=>Object.keys(srs).filter(id=>byId[id]!=null && srs[id].due<=today());

const CHECK='<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const LOCK='<svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M17 9V7a5 5 0 0 0-10 0v2H6a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V10a1 1 0 0 0-1-1h-1zM9 7a3 3 0 0 1 6 0v2H9V7z"/></svg>';
const STAR='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2l2.5 5.2 5.7.5-4.3 3.7 1.3 5.6L12 20.5 6.8 18.2l1.3-5.6-4.3-3.7 5.7-.5z"/></svg>';
const FLAME='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.4 3-2 4-2 7 0 1.7 1 3 2 3s2-1.3 2-3c0-.7-.2-1.3-.5-2 2 1 3.5 3 3.5 5.6A5 5 0 0 1 7 12.6C7 8 12 6 12 2z"/></svg>';
const PENCIL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';

/* ---- guided trace: draw the syllable over a faint guide (no grading, just motor memory) ---- */
const traceVeil=document.getElementById("traceVeil"), traceGuide=document.getElementById("traceGuide"),
      traceStage=document.getElementById("traceStage"), traceCanvas=document.getElementById("traceCanvas");
let tctx=null, tracing=false;
function openTrace(word){
  document.getElementById("traceHead").innerHTML=`trace <b>${word}</b>`;
  traceGuide.textContent=word;
  traceVeil.classList.add("show");
  sizeTrace(word);
}
function sizeTrace(word){
  const b=traceStage.getBoundingClientRect();
  if(!b.width){ requestAnimationFrame(()=>sizeTrace(word)); return; }   // layout not ready yet
  const dpr=window.devicePixelRatio||1;
  traceCanvas.width=b.width*dpr; traceCanvas.height=b.height*dpr;
  traceCanvas.style.width=b.width+"px"; traceCanvas.style.height=b.height+"px";
  tctx=traceCanvas.getContext("2d"); tctx.setTransform(dpr,0,0,dpr,0,0);
  tctx.lineWidth=Math.max(9,b.width*0.05); tctx.lineCap="round"; tctx.lineJoin="round";
  tctx.strokeStyle=(getComputedStyle(document.body).getPropertyValue("--accent")||"#3d5afe").trim();
  tctx.clearRect(0,0,b.width,b.height);
  traceGuide.style.fontSize=b.height*(word.length<=1?0.72:word.length===2?0.44:0.31)+"px";
}
function tpos(e){ const r=traceCanvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
traceCanvas.addEventListener("pointerdown",e=>{ if(!tctx)return; tracing=true; const p=tpos(e); tctx.beginPath(); tctx.moveTo(p.x,p.y); tctx.lineTo(p.x+0.1,p.y+0.1); tctx.stroke(); try{traceCanvas.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); });
traceCanvas.addEventListener("pointermove",e=>{ if(!tracing||!tctx)return; const p=tpos(e); tctx.lineTo(p.x,p.y); tctx.stroke(); });
traceCanvas.addEventListener("pointerup",()=>{ tracing=false; });
document.getElementById("traceClear").onclick=()=>{ if(tctx){ const b=traceStage.getBoundingClientRect(); tctx.clearRect(0,0,b.width,b.height); } };
document.getElementById("traceDone").onclick=()=>traceVeil.classList.remove("show");

/* ---------- level select (cannot skip) ---------- */
function showMap(){
  screen="map"; reviewMode=false; lessonMode=false; backBtn.hidden=true; acctBtn.hidden=!sb; stage.classList.add("map-mode");
  const due=dueNow(), doneToday=streak.day===today();
  const rc=`<div class="review-card">
      <div class="streak" title="day streak">${FLAME}<span>${streak.count}</span></div>
      <div class="rc-main">
        <div class="rc-title">Daily review</div>
        <div class="rc-sub">${doneToday?"done today — come back tomorrow":due.length?`${due.length} word${due.length>1?"s":""} due`:"nothing due right now"}</div>
      </div>
      ${(!doneToday&&due.length)?`<button class="rc-go" id="reviewBtn">review</button>`:``}
    </div>
    <button class="journal-card" id="journalBtn">
      <span class="jc-book">📖</span>
      <span class="jc-main">
        <div class="jc-title">Your dictionary</div>
        <div class="jc-sub">${(c=>c.got?`${c.got} word${c.got>1?"s":""} you figured out yourself`:"figure out meanings by reading — they collect here")(journalCounts())}</div>
      </span>
    </button>
    <div class="dev"><button id="nextDay">day +1 (test)</button></div>`;
  let h=rc+'<div class="map">';
  LESSONS.forEach((le,i)=>{
    const st = lessonState(i);
    const badge = st==="done"?`<span class="badge">${CHECK}</span>`
                : st==="locked"?`<span class="badge lock">${LOCK}</span>`:``;
    h+=`<div class="node ${st}">
      <button class="node-btn" ${st==="locked"?"disabled":`data-i="${i}"`}>
        <span class="node-em">${lessonEmoji(le)}</span>${badge}</button>
      <span class="node-num">${i+1}</span>
    </div>`;
  });
  SOON.forEach(s=>{ h+=`<div class="node locked">
      <button class="node-btn" disabled><span class="node-em">${s.emoji}</span><span class="badge lock">${LOCK}</span></button>
      <span class="node-num">soon</span>
    </div>`; });
  stage.innerHTML=h+'</div>';
  stage.querySelectorAll(".node-btn[data-i]").forEach(b=>b.onclick=()=>startLesson(+b.dataset.i));
  const rb=document.getElementById("reviewBtn"); if(rb) rb.onclick=startReview;
  document.getElementById("journalBtn").onclick=showJournal;
  document.getElementById("nextDay").onclick=()=>{ simDay++; try{localStorage.setItem(SIM_KEY,simDay);}catch(e){} showMap(); };
  if(!doneToday && due.length){ stage.scrollTop=0; }   // keep the review CTA visible when it matters
  else { const cur=stage.querySelector(".node.current")||stage.querySelector(".node.done:last-of-type");
         if(cur) cur.scrollIntoView({block:"center"}); }
}
/* ---------- the lesson runner: a fast burst of items, one reward at the end ---------- */
function startLesson(i){
  lessonIdx=i; lesson=LESSONS[i].items.map(it=>byId[it.id]); lessonPos=0;
  screen="play"; reviewMode=false; lessonMode=true; backBtn.hidden=false; acctBtn.hidden=true;
  stage.classList.remove("map-mode");
  playLessonItem();
}
function playLessonItem(){ idx=lesson[lessonPos]; renderPlay(); }   // renderPlay dispatches to renderM2
function lessonBar(){
  if(!lessonMode) return "";
  return `<div class="lesson-bar">${lesson.map((_,k)=>
    `<span class="lb ${k<lessonPos?'done':k===lessonPos?'now':''}"></span>`).join("")}</div>`;
}
// solved one item inside a lesson: record it, then slide to the next (no full reward)
function itemSolved(){
  const lv=L[idx];
  bumpJournal(lv); bumpConcepts(lv);
  if(!(lv.id in srs)){ srs[lv.id]={stars:0,due:today()+1}; saveSrs(); }   // enters the review queue
  lessonPos++;
  setTimeout(()=> lessonPos<lesson.length ? playLessonItem() : completeLesson(), 480);
}
function completeLesson(){
  const le=LESSONS[lessonIdx], fresh=!doneSet.has(le.id);
  doneSet.add(le.id); saveDone();
  const t=today();
  if(streak.day!==t){ streak.count = streak.day===t-1 ? streak.count+1 : 1; streak.day=t; writeJSON(STREAK_KEY,streak); cloudSaveDebounced(); }
  const goNext = fresh && lessonIdx+1 < LESSONS.length;
  const ripe = ripeBatch(le, 2);     // up to two discoveries per lesson, this lesson's words first
  audio.win(); burst();
  veil.classList.add("show");
  panel.animate([{transform:"translateY(100%)"},{transform:"translateY(0)"}],{duration:340,easing:"cubic-bezier(.2,.8,.2,1)"});
  // words first, then at most one grammar concept, then the reward
  chainGuesses(ripe, ()=> chainConcepts(conceptBatch(1), ()=>lessonReward(goNext)));
}
function lessonReward(goNext){
  const le=LESSONS[lessonIdx];
  const chips = le.items.map(it=>`<span class="recap"><b>${wordFor(byId[it.id])}</b>${it.emoji?` ${it.emoji}`:""}</span>`).join("");
  const last = le.items[le.items.length-1];
  panel.innerHTML=`
    <div class="p-emoji" id="pEmoji">✨</div>
    <div class="word">lesson done</div>
    <div class="recap-row">${chips}</div>
    ${!last.m2?`<div class="trace-row"><button class="trace-btn" id="traceBtn">${PENCIL}<span>trace it</span></button></div>`:``}
    <button class="cta">${goNext?"next lesson →":"back to map"}</button>`;
  panel.querySelector("#pEmoji").animate([{transform:"scale(0)"},{transform:"scale(1.15)"},{transform:"scale(1)"}],{duration:460,delay:80,easing:"cubic-bezier(.22,1,.36,1)",fill:"backwards"});
  const tb=panel.querySelector("#traceBtn"); if(tb) tb.onclick=()=>openTrace(wordFor(byId[last.id]));
  panel.querySelector(".cta").onclick=()=>{
    veil.classList.remove("show"); lessonMode=false;
    if(goNext) startLesson(lessonIdx+1); else showMap();
  };
}
backBtn.onclick=()=>{ lessonMode=false; showMap(); };

/* the dictionary the learner wrote — only self-discovered meanings, newest first */
function showJournal(){
  screen="journal"; backBtn.hidden=false; acctBtn.hidden=true; stage.classList.add("map-mode");
  const entries=Object.keys(journal).filter(h=>journal[h].got)
    .sort((a,b)=>(journal[b].day||0)-(journal[a].day||0));
  const {got,total}=journalCounts();
  let h=`<div class="journal">
    <h2>📖 Your dictionary</h2>
    <p class="j-sub">${got} / ${total} — every meaning here is one <b>you</b> figured out</p>`;
  if(!entries.length)
    h+=`<p class="j-sub">nothing yet — keep reading. When you've seen a word enough times,
        the app will ask what you think it means.</p>`;
  entries.forEach(han=>{
    const w=WORD_BANK.find(b=>b.han===han); if(!w) return;
    h+=`<div class="jrow" data-h="${han}">
      <span class="jh">${han}</span><span class="je">${w.emoji}</span>
      <span class="jm">${journal[han].got}</span></div>`;
  });
  if(got<total) h+=`<p class="j-locked">${total-got} more words are hiding in the levels — keep reading</p>`;
  const cracked=CONCEPTS.filter(c=>grammar[c.id]&&grammar[c.id].got);
  if(cracked.length){
    h+=`<h2 style="margin-top:22px">🧩 Grammar you cracked</h2>`;
    cracked.forEach(c=>{ h+=`<div class="jrow" data-h="${c.marker}">
      <span class="jh">${c.marker}</span><span class="jm">${c.right}</span></div>`; });
  }
  stage.innerHTML=h+`</div>`;
  stage.querySelectorAll(".jrow").forEach(r=>r.onclick=()=>speak(r.dataset.h));
}

/* daily review: replay whatever's due (hints off); clean recalls earn stars */
function startReview(){ reviewQueue=dueNow(); reviewPos=0; if(!reviewQueue.length) return; reviewMode=true; lessonMode=false; nextReview(); }
function nextReview(){
  if(reviewPos>=reviewQueue.length){ finishReview(); return; }
  idx=byId[reviewQueue[reviewPos]]; screen="play"; backBtn.hidden=false; acctBtn.hidden=true; stage.classList.remove("map-mode"); renderPlay();
}
function finishReview(){
  reviewMode=false;
  const t=today();
  if(streak.day!==t){ streak.count = streak.day===t-1 ? streak.count+1 : 1; streak.day=t; writeJSON(STREAK_KEY,streak); cloudSaveDebounced(); }
  showMap();
}

function renderPlay(){
  const lv = L[idx];
  if(lv.m2){ renderM2(lv); return; }                                  // whole-word sentence
  total = lv.blocks.reduce((s,b)=>s+(Array.isArray(b)?b.length:0),0);  // given blocks aren't built
  filled = 0; mistakes = 0;

  stage.innerHTML = `
    <div class="goal">
      <div class="goal-emoji" id="goalEmoji">${lv.emoji}</div>
      <div class="goal-hangul">${WORDS[idx]}</div>
      <div class="goal-say">
        <span class="goal-roma">${lv.roma}</span>
        <button class="say-btn" id="sayBtn" aria-label="Hear it out loud">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M15.5 8.5a4 4 0 0 1 0 7"/><path d="M18.5 6a7 7 0 0 1 0 12"/></svg>
        </button>
      </div>
    </div>
    ${idx===0?`<p class="instr">drag the letters to build it</p>`:``}
    <div class="blocks" id="blocks"></div>
    <div class="tray" id="tray"></div>`;
  stage.insertAdjacentHTML("afterbegin", lessonBar());

  const blocksEl = document.getElementById("blocks");
  lv.blocks.forEach((blk,bi)=>{
    const b=document.createElement("div"); b.className="block"; b.dataset.b=bi;
    if(!Array.isArray(blk)){                 // a "given" syllable — shown, not built
      b.classList.add("given"); b.textContent=blk; blocksEl.appendChild(b); return;
    }
    blk.forEach(([jamo,x,y,w,h],si)=>{
      const s=document.createElement("div"); s.className="slot";
      s.dataset.jamo=jamo; s.dataset.key=bi+"-"+si;
      s.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;
      b.appendChild(s);
    });
    blocksEl.appendChild(b);
  });
  // fit multiple blocks within the stage on narrow screens
  const n=lv.blocks.length;
  if(n>1){
    const inner=stage.clientWidth-44;
    blocksEl.style.setProperty("--bsz", Math.min(210,(inner-16*(n-1))/n)+"px");
  }
  // size glyphs relative to block after layout
  requestAnimationFrame(()=>{
    document.querySelectorAll(".slot").forEach(s=>{
      s.style.fontSize = Math.min(s.offsetWidth,s.offsetHeight)*0.68+"px"; });
    document.querySelectorAll(".block.given").forEach(b=>{
      b.style.fontSize = b.offsetHeight*0.5+"px"; });
  });

  const trayEl=document.getElementById("tray");
  shuffle(lv.tray).forEach(spec=>{
    const [j,r]=spec.split("|");
    const t=document.createElement("div"); t.className="tile"; t.dataset.jamo=j;
    t.innerHTML=`<span class="j">${j}</span>${(lv.hard||reviewMode)?``:`<span class="r">${r}</span>`}`;
    t.addEventListener("pointerdown",startDrag);
    trayEl.appendChild(t);
  });

  const g=document.getElementById("goalEmoji");
  if(g) g.animate(
    [{opacity:0,transform:"scale(.6) translateY(6px)"},
     {opacity:1,transform:"scale(1.08)"},
     {opacity:1,transform:"scale(1) translateY(0)"}],
    {duration:520,easing:"cubic-bezier(.22,1,.36,1)",fill:"backwards"});

  const word=WORDS[idx];
  const sayBtn=document.getElementById("sayBtn");
  if(sayBtn) sayBtn.onclick=()=>speak(word);
  if(g) g.onclick=()=>speak(word);       // tap the picture to hear it
  speak(word);                            // say it when the word appears
}

/* M2: drag whole-word tiles into the right order. Reuses the same drag engine —
   slots and tiles just carry a word in dataset.jamo instead of a letter. */
function renderM2(lv){
  total=lv.seq.length; filled=0; mistakes=0;
  stage.innerHTML=`
    <div class="goal">
      <div class="seq">${lv.seq.map(s=>`<span>${s[1]}</span>`).join("")}</div>
      <div class="goal-say">
        <span class="goal-roma">${lv.roma}</span>
        <button class="say-btn" id="sayBtn" aria-label="Hear it out loud"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M15.5 8.5a4 4 0 0 1 0 7"/><path d="M18.5 6a7 7 0 0 1 0 12"/></svg></button>
      </div>
    </div>
    <p class="instr">drag the words into the right order</p>
    <div class="sentence" id="sentence"></div>
    <div class="tray" id="tray"></div>`;
  stage.insertAdjacentHTML("afterbegin", lessonBar());
  const sen=document.getElementById("sentence");
  lv.seq.forEach(([w])=>{
    const s=document.createElement("div"); s.className="slot word"; s.dataset.jamo=w; sen.appendChild(s);
  });
  const emo = w => (lv.seq.find(s=>s[0]===w)||[])[1] || (WORD_BANK.find(b=>b.han===w)||{}).emoji || "";
  const trayEl=document.getElementById("tray");
  shuffle(lv.tray).forEach(w=>{
    const t=document.createElement("div"); t.className="tile word"; t.dataset.jamo=w;
    const e=emo(w);
    t.innerHTML=`<span class="wj">${w}</span>${e?`<span class="we">${e}</span>`:``}`;
    t.addEventListener("pointerdown",startDrag);
    trayEl.appendChild(t);
  });
  const sentence=lv.seq.map(s=>s[0]).join(" ");
  const sayBtn=document.getElementById("sayBtn");
  if(sayBtn) sayBtn.onclick=()=>speak(sentence);
  speak(sentence);
}

/* ---------- drag ---------- */
let drag=null;
function startDrag(e){
  if(this.classList.contains("used")) return;
  audio.init(); audio.grab();
  e.preventDefault();
  const r=this.getBoundingClientRect();
  const ghost=this.cloneNode(true);
  ghost.classList.add("ghost");
  ghost.style.width=r.width+"px"; ghost.style.height=r.height+"px";
  document.body.appendChild(ghost);
  this.style.opacity=".25";
  drag={src:this,ghost,jamo:this.dataset.jamo,w:r.width,h:r.height};
  ghost.animate([{transform:"scale(1)"},{transform:"scale(1.12)"}],{duration:120,fill:"forwards"});
  move(e);
  window.addEventListener("pointermove",move);
  window.addEventListener("pointerup",drop);
}
function move(e){
  if(!drag) return;
  drag.ghost.style.left=(e.clientX-drag.w/2)+"px";
  drag.ghost.style.top=(e.clientY-drag.h/2)+"px";
  const hit=slotUnder(e.clientX,e.clientY);
  document.querySelectorAll(".slot.hint").forEach(s=>s.classList.remove("hint"));
  // teaching glow: the correct empty slot for the held letter
  document.querySelectorAll(".slot").forEach(s=>{
    if(!s.classList.contains("filled") && s.dataset.jamo===drag.jamo) s.classList.add("hint");
  });
}
function slotUnder(x,y){
  return [...document.querySelectorAll(".slot")].find(s=>{
    if(s.classList.contains("filled")) return false;
    const r=s.getBoundingClientRect();
    return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
  });
}
function drop(e){
  window.removeEventListener("pointermove",move);
  window.removeEventListener("pointerup",drop);
  document.querySelectorAll(".slot.hint").forEach(s=>s.classList.remove("hint"));
  if(!drag) return;
  const d=drag; drag=null;
  const slot=slotUnder(e.clientX,e.clientY);
  if(slot && slot.dataset.jamo===d.jamo){ place(slot,d); }
  else { bounce(d); }
}
function place(slot,d){
  const sr=slot.getBoundingClientRect();
  d.ghost.animate(
    [{left:d.ghost.style.left,top:d.ghost.style.top,transform:"scale(1.12)"},
     {left:sr.left+"px",top:sr.top+"px",width:sr.width+"px",height:sr.height+"px",transform:"scale(1)"}],
    {duration:180,easing:"cubic-bezier(.16,1,.3,1)",fill:"forwards"}).onfinish=()=>{
      d.ghost.remove();
      slot.textContent=d.jamo; slot.classList.add("filled");
      slot.animate([{transform:"scale(1.28)"},{transform:"scale(.96)"},{transform:"scale(1)"}],{duration:260,easing:"cubic-bezier(.22,1,.36,1)"});
      d.src.classList.add("used");
      filled++; audio.snap(filled);
      checkSolved();
    };
}
function bounce(d){
  const sr=d.src.getBoundingClientRect();
  audio.err(); mistakes++;
  d.ghost.animate(
    [{left:d.ghost.style.left,top:d.ghost.style.top},{left:sr.left+"px",top:sr.top+"px",transform:"scale(1)"}],
    {duration:200,easing:"ease-out",fill:"forwards"}).onfinish=()=>{ d.ghost.remove(); d.src.style.opacity="1"; };
  d.src.animate([{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],{duration:250});
}

/* ---------- solve + celebrate ---------- */
function checkSolved(){
  if(filled<total) return;
  document.querySelectorAll(".block").forEach(b=>{
    b.classList.add("solved");
    b.animate([{transform:"scale(1)"},{transform:"scale(1.06)"},{transform:"scale(1)"}],{duration:420,easing:"ease-out"});
  });
  setTimeout(()=> lessonMode ? itemSolved() : celebrate(), 380);
}
/* celebrate is now the DAILY-REVIEW reward only; fresh learning runs through the lesson runner */
function celebrate(){
  const lv=L[idx];
  const word = wordFor(idx);            // real composed Unicode syllable(s)
  audio.win(); burst(); speak(word);
  bumpJournal(lv); bumpConcepts(lv);    // a review is still an exposure
  let starEarned=false;
  const it = srs[lv.id] || {stars:0,due:today()};
  if(mistakes===0){ it.stars=Math.min(3,it.stars+1); it.due=today()+DUE_BY_STARS[it.stars]; starEarned=true; }
  else { it.due=today()+1; }            // fumbled — see it again tomorrow, stars held
  srs[lv.id]=it; saveSrs();
  const moreReview = reviewPos+1 < reviewQueue.length;
  const meanBit = lv.m2 ? "" : (gotMean(lv.word) ? ` · <b>${lv.mean}</b>` : ` · <b class="undisc">?</b>`);
  panel.innerHTML = `
    <div class="p-emoji" id="pEmoji">${lv.emoji}</div>
    <div class="word">${word}</div>
    <div class="roma">${lv.roma}${meanBit}</div>
    <div class="tag">${starEarned?"★ clean recall — star earned":"seen again — you'll get it"}</div>
    ${canSpeak()?`<div class="say-row">
      <button class="mic" id="micBtn">${MIC_SVG}<span class="mic-label">say it</span></button>
      <div class="say-feedback" id="sayFb"></div>
    </div>`:``}
    <button class="cta">${moreReview?"next →":"done ✓"}</button>`;
  panel.querySelector("#pEmoji").animate(
    [{transform:"scale(0)"},{transform:"scale(1.15)"},{transform:"scale(1)"}],
    {duration:460,delay:120,easing:"cubic-bezier(.22,1,.36,1)",fill:"backwards"});
  wireSayIt(word);   // M4: optional speaking check (parked)
  panel.querySelector(".cta").onclick=()=>{
    const cont=()=>{ veil.classList.remove("show"); reviewPos++; nextReview(); };
    const ripe=nextRipe(lv.m2?null:lv.word); // a meaning ready to be guessed? ask before moving on
    if(ripe) showGuess(ripe, cont); else cont();
  };
  veil.classList.add("show");
  panel.animate([{transform:"translateY(100%)"},{transform:"translateY(0)"}],{duration:340,easing:"cubic-bezier(.2,.8,.2,1)"});
}
function wordFor(i){ return WORDS[i]; }

function burst(){
  const cols=["#3d5afe","#ffb703","#12b886","#ff5a5f"];
  for(let i=0;i<26;i++){
    const c=document.createElement("div"); c.className="confetti";
    c.style.background=cols[i%cols.length];
    const x=innerWidth/2, y=innerHeight*0.62;
    c.style.left=x+"px"; c.style.top=y+"px";
    document.body.appendChild(c);
    const ang=Math.random()*Math.PI*2, dist=120+Math.random()*220;
    c.animate(
      [{transform:`translate(0,0) rotate(0deg)`,opacity:1},
       {transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist - 60}px) rotate(${Math.random()*720}deg)`,opacity:0}],
      {duration:900+Math.random()*500,easing:"cubic-bezier(.1,.6,.3,1)",fill:"forwards"}).onfinish=()=>c.remove();
  }
}

/* ---------- self-check: fails loudly if the engine or banks are wrong ---------- */
(function check(){
  // decomposition is the load-bearing piece
  const m=syllable("물");
  console.assert(m.cho==="ㅁ"&&m.jung==="ㅜ"&&m.jong==="ㄹ", "decompose 물");
  console.assert(syllable("나").jong==="", "나 has no tail");
  console.assert(romaOf("나무")==="namu"&&romaOf("물")==="mul", "romaja");
  // liaison: final consonant links into a following silent-onset syllable; ㅇ(ng) does not
  console.assert(romaOf("먹어요")==="meogeoyo", "liaison meogeoyo, got "+romaOf("먹어요"));
  console.assert(romaOf("얼음")==="eoreum", "liaison eoreum, got "+romaOf("얼음"));
  console.assert(romaOf("병원")==="byeongwon", "ng does not link, got "+romaOf("병원"));
  console.assert(romaOf("학교")==="hakgyo"&&romaOf("얼굴")==="eolgul", "non-liaison unchanged");
  // every buildable slot must have a matching tile
  L.forEach((lv,i)=>{
    if(lv.m2){ lv.seq.forEach(([w])=>console.assert(lv.tray.includes(w), `M2 L${i}: tray missing ${w}`)); return; }
    const need = lv.blocks.filter(Array.isArray).flat().map(s=>s[0]);
    const have = lv.tray.map(t=>t.split("|")[0]);
    need.forEach(j=>console.assert(have.includes(j), `L${i} (${lv.word}): tray missing ${j}`));
  });
  // M2 sentences: every noun is a real bank word, verbs are known, decoys are real words
  M2.forEach((m,k)=>{
    m.seq.forEach(([w])=>console.assert(
      M2_VERBS.has(w)||conceptByMarker[w]||WORD_BANK.some(b=>b.han===w), `M2 #${k}: unknown word ${w}`));
    console.assert(WORD_BANK.some(b=>b.han===m.decoy), `M2 #${k}: decoy ${m.decoy} not in bank`);
  });
  // grammar-by-inference: 는 appears in enough sentences to trigger, and ripeness fires/cools
  console.assert(M2.filter(m=>m.seq.some(s=>s[0]==="는")).length>=CONCEPTS[0].trigger, "는 appears enough to be discoverable");
  { const bak=grammar; grammar={"topic-neun":{seen:CONCEPTS[0].trigger,got:false}};
    console.assert(conceptRipe(CONCEPTS[0]), "concept ripe at trigger");
    grammar["topic-neun"].cool=CONCEPTS[0].trigger+1;
    console.assert(!conceptRipe(CONCEPTS[0]), "concept cools after a miss");
    grammar=bak; }
  console.assert(L.length===WORD_BANK.length+M2.length, "curriculum interleaves all levels");
  console.assert(L.slice(0,4).some(l=>l.m2), "a sentence arrives within the first four levels");
  // lessons + stable ids: every item has a unique id, lessons cover L exactly, ids are stable
  const ids=new Set(L.map(it=>it.id)); console.assert(ids.size===L.length, "item ids unique");
  console.assert(LESSONS.reduce((n,le)=>n+le.items.length,0)===L.length, "lessons cover every item once");
  console.assert(LESSONS.every(le=>le.items.length<=LESSON_MAX), "no lesson exceeds LESSON_MAX");
  console.assert(byId["나"]===0 && L[byId["s:나_소_봐요"]].m2, "byId maps stable ids to positions");
  // discovery journal: distractors are real, ripeness fires and cools correctly
  const ds=distractorsFor("water");
  console.assert(ds.length===3 && !ds.includes("water"), "journal distractors");
  { const bak=journal; journal={"물":{seen:RIPE_AT,got:null}};
    console.assert(nextRipe("물")==="물", "ripe at threshold");
    journal["물"].cool=RIPE_AT+2;
    console.assert(nextRipe("물")===null, "cooldown holds after a miss");
    journal=bak; }
  // M4 speech matching: forgiving but not blind
  console.assert(heardMatch(["물"],"물") && heardMatch(["물 있어요"],"물 있어요"), "M4 accepts exact");
  console.assert(heardMatch(["물이요"],"물"), "M4 accepts close");
  console.assert(!heardMatch(["불"],"물"), "M4 rejects a different word");
})();

const authVeil=document.getElementById("authVeil");
let authMode="in";
function setAuthMode(m){ authMode=m;
  document.getElementById("authTitle").textContent = m==="up"?"Create account":"Sign in";
  document.getElementById("authSubmit").textContent = m==="up"?"Create account":"Sign in";
  document.getElementById("authToggle").textContent = m==="up"?"Have an account? Sign in":"New here? Create an account";
}
function openAuth(){ if(!sb) return; setAuthMode("in"); document.getElementById("authErr").textContent=""; authVeil.classList.add("show"); document.getElementById("authEmail").focus(); }
function closeAuth(){ authVeil.classList.remove("show"); }
function updateAcct(){ if(!sb){ acctBtn.hidden=true; return; }
  acctBtn.textContent = user ? (user.email||"account").split("@")[0] : "sign in";
  acctBtn.classList.toggle("in", !!user);
}
async function submitAuth(){
  if(!sb) return;
  const email=document.getElementById("authEmail").value.trim(), pass=document.getElementById("authPass").value, err=document.getElementById("authErr");
  if(!email||!pass){ err.textContent="enter an email and password"; return; }
  err.textContent="…";
  const r = authMode==="up" ? await sb.auth.signUp({email,password:pass}) : await sb.auth.signInWithPassword({email,password:pass});
  if(r.error){ err.textContent=r.error.message; return; }
  if(authMode==="up" && !r.data.session){ err.textContent="check your email to confirm, then sign in"; setAuthMode("in"); return; }
  err.textContent=""; closeAuth();
}
async function cloudSave(){ if(!sb||!user) return;
  try{ await sb.from("progress").upsert({user_id:user.id, data:{doneLessons:[...doneSet],srs,streak,journal,grammar}, updated_at:new Date().toISOString()}); }catch(e){}
}
async function cloudLoad(){ if(!sb||!user) return;
  try{
    const {data,error}=await sb.from("progress").select("data").eq("user_id",user.id).maybeSingle();
    if(error){ return; }
    if(!data){ cloudSave(); return; }                 // first login on this account -> push local up
    const c=data.data||{}; let changed=false;
    if(Array.isArray(c.doneLessons)){ const n=doneSet.size; c.doneLessons.forEach(id=>doneSet.add(id));
      if(doneSet.size>n){ writeJSON(DONE_KEY,[...doneSet]); changed=true; } }
    if(c.srs){ for(const k in c.srs){ if(byId[k]==null) continue; const cl=c.srs[k], loc=srs[k]; if(!loc||(cl.stars||0)>(loc.stars||0)){ srs[k]=cl; changed=true; } } }
    if(c.streak && (c.streak.count||0)>streak.count){ streak=c.streak; writeJSON(STREAK_KEY,streak); changed=true; }
    if(c.journal){ for(const h in c.journal){ const cl=c.journal[h], lo=journal[h];
      journal[h]={ seen:Math.max(cl.seen||0, lo?.seen||0),
                   got:(lo&&lo.got)||cl.got||null,
                   day:(lo&&lo.day)||cl.day, cool:Math.max(cl.cool||0, lo?.cool||0) };
      changed=true; }
      writeJSON(JKEY,journal); }
    if(c.grammar){ for(const k in c.grammar){ const cl=c.grammar[k], lo=grammar[k];
      grammar[k]={ seen:Math.max(cl.seen||0, lo?.seen||0), got:(lo&&lo.got)||cl.got||false,
                   day:(lo&&lo.day)||cl.day, cool:Math.max(cl.cool||0, lo?.cool||0), missed:(lo&&lo.missed)||cl.missed };
      changed=true; } writeJSON(GKEY,grammar); }
    LESSONS.forEach(le=>{ if(doneSet.has(le.id)) le.items.forEach(it=>{ if(!(it.id in srs)) srs[it.id]={stars:0,due:today()}; }); });
    writeJSON(SRS_KEY,srs); cloudSave();
    if(changed && screen==="map") showMap();
  }catch(e){}
}

  if(!sb) return;

}

document.getElementById("authSubmit").onclick=submitAuth;
document.getElementById("authToggle").onclick=()=>setAuthMode(authMode==="up"?"in":"up");
document.getElementById("authClose").onclick=closeAuth;
document.getElementById("authPass").addEventListener("keydown",e=>{ if(e.key==="Enter") submitAuth(); });
if(sb){
  sb.auth.onAuthStateChange((_e,session)=>{ user=session?.user||null; updateAcct(); if(user) cloudLoad(); });
  sb.auth.getSession().then(({data})=>{ user=data.session?.user||null; updateAcct(); if(user) cloudLoad(); if(screen==="map") showMap(); });
} else updateAcct();
